name: build-pet-desktop

on:
  push:
    tags:
      - "pet-v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            artifact: mac
          - os: windows-latest
            args: --win
            artifact: win
          - os: ubuntu-latest
            args: --linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pet-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pet-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-${{ matrix.artifact }}
          path: |
            pet-desktop/dist/*.dmg
            pet-desktop/dist/*.zip
            pet-desktop/dist/*.exe
            pet-desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
